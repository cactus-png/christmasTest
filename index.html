
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Christmas Surprise</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- ====================================== -->
    <!-- PAGE 1: PASSWORD                       -->
    <!-- ====================================== -->

    <section id="passwordPage" class="page">

        <div class="gate-card">

            <h1>enter</h1>

            <form id="passwordForm">

                <input
                    type="text"
                    id="passwordInput"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >

                <button type="submit">Enter</button>

            </form>

            <p id="passwordError" class="error"></p>

        </div>

    </section>


    <!-- ====================================== -->
    <!-- PAGE 2: CONNECTIONS GAME               -->
    <!-- ====================================== -->

    <section id="connectionsPage" class="page" hidden>

        <div class="game-card">

            <h1>Connections</h1>

            <p class="game-instructions">
                Group the 16 words into four categories of four.
            </p>

            <div id="solvedGroups" class="solved-groups"></div>

            <div id="puzzleGrid" class="connections-grid"></div>

            <p id="gameMessage" class="game-message">
                Select four words that belong together.
            </p>

            <p id="mistakesRemaining" class="mistakes">
                Mistakes remaining: 4
            </p>

            <div class="game-controls">

                <button id="shuffleButton" type="button">
                    Shuffle
                </button>

                <button id="deselectButton" type="button">
                    Deselect
                </button>

                <button id="submitGuessButton" type="button" disabled>
                    Submit
                </button>

            </div>

            <button id="restartButton" type="button" hidden>
                Restart Puzzle
            </button>

            <button id="previewTreeButton" type="button" disabled>
                Continue →
            </button>

        </div>

    </section>


    <!-- ====================================== -->
    <!-- PAGE 3: CHRISTMAS TREE                 -->
    <!-- ====================================== -->

    <section id="treePage" class="page" hidden>

        <div id="scene"></div>

        <div class="message">
            Merry Christmas
        </div>

        <div class="credit">
            Made with love
        </div>

    </section>


    <!-- ====================================== -->
    <!-- JAVASCRIPT FILES                       -->
    <!-- ====================================== -->

    <script type="module" src="./connections.js"></script>
    <script type="module" src="./gate.js"></script>

</body>

</html>
