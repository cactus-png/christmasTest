
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Christmas Surprise</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- ====================================== -->
    <!-- PAGE 1: PASSWORD                       -->
    <!-- ====================================== -->

    <section id="passwordPage" class="page">

        <div class="gate-card">

            <h1>enter</h1>

            <form id="passwordForm">

                <input
                    type="text"
                    id="passwordInput"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >

                <button type="submit">Enter</button>

            </form>

            <p id="passwordError" class="error"></p>

        </div>

    </section>


    <!-- ====================================== -->
    <!-- PAGE 2: CONNECTIONS GAME               -->
    <!-- ====================================== -->

    <section id="connectionsPage" class="page" hidden>

        <div class="game-card">

            <h1>Connections</h1>

            <div class="puzzle-placeholder">

                <div class="puzzle-grid">
                    <div>❄</div>
                    <div>❄</div>
                    <div>❄</div>
                    <div>❄</div>
                </div>

                <p>YOUR CONNECTIONS PUZZLE</p>

                <span>Coming soon...</span>

            </div>

            <button id="previewTreeButton">
                Continue →
            </button>

        </div>

    </section>


    <!-- ====================================== -->
    <!-- PAGE 3: CHRISTMAS TREE                 -->
    <!-- ====================================== -->

    <section id="treePage" class="page" hidden>

        <div id="scene"></div>

        <div class="message">
            Merry Christmas
        </div>

        <div class="credit">
            Made with love
        </div>

    </section>


    <!-- ====================================== -->
    <!-- PAGE CONTROL SCRIPT                    -->
    <!-- ====================================== -->

    <script type="module" src="./gate.js"></script>

</body>
</html>
